[project]
name = "mojiterm"
version = "0.1.0"
description = ""
authors = [
    {name = "jd1705",email = "soulbusterjd17@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12, < 3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "tortoise (>=0.1.1,<0.2.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "textual (>=8.2.8,<9.0.0)",
    "textual-dev (>=1.8.0,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "mojiterm", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
